<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Autoresearch · Conductor</title>
<style>
:root{
  --background:oklch(1 0 0); --foreground:oklch(0.153 0.006 107.1);
  --card:oklch(1 0 0); --card-foreground:oklch(0.153 0.006 107.1);
  --popover:oklch(1 0 0); --popover-foreground:oklch(0.153 0.006 107.1);
  --primary:oklch(0.511 0.096 186.391); --primary-foreground:oklch(0.984 0.014 180.72);
  --secondary:oklch(0.967 0.001 286.375); --secondary-foreground:oklch(0.21 0.006 285.885);
  --muted:oklch(0.966 0.005 106.5); --muted-foreground:oklch(0.58 0.031 107.3);
  --accent:oklch(0.966 0.005 106.5); --accent-foreground:oklch(0.228 0.013 107.4);
  --destructive:oklch(0.577 0.245 27.325);
  --border:oklch(0.93 0.007 106.5); --input:oklch(0.93 0.007 106.5); --ring:oklch(0.737 0.021 106.9);
  --radius:0.625rem;
  --sidebar:oklch(0.988 0.003 106.5); --sidebar-foreground:oklch(0.153 0.006 107.1);
  --sidebar-primary:oklch(0.6 0.118 184.704); --sidebar-primary-foreground:oklch(0.984 0.014 180.72);
  --sidebar-accent:oklch(0.966 0.005 106.5); --sidebar-accent-foreground:oklch(0.228 0.013 107.4);
  --sidebar-border:oklch(0.93 0.007 106.5);
}
.dark{
  --background:oklch(0.153 0.006 107.1); --foreground:oklch(0.988 0.003 106.5);
  --card:oklch(0.228 0.013 107.4); --card-foreground:oklch(0.988 0.003 106.5);
  --popover:oklch(0.228 0.013 107.4); --popover-foreground:oklch(0.988 0.003 106.5);
  --primary:oklch(0.437 0.078 188.216); --primary-foreground:oklch(0.984 0.014 180.72);
  --secondary:oklch(0.274 0.006 286.033); --secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.286 0.016 107.4); --muted-foreground:oklch(0.737 0.021 106.9);
  --accent:oklch(0.286 0.016 107.4); --accent-foreground:oklch(0.988 0.003 106.5);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%); --input:oklch(1 0 0 / 15%); --ring:oklch(0.58 0.031 107.3);
  --sidebar:oklch(0.228 0.013 107.4); --sidebar-foreground:oklch(0.988 0.003 106.5);
  --sidebar-primary:oklch(0.704 0.14 182.503); --sidebar-primary-foreground:oklch(0.277 0.046 192.524);
  --sidebar-accent:oklch(0.286 0.016 107.4); --sidebar-accent-foreground:oklch(0.988 0.003 106.5);
  --sidebar-border:oklch(1 0 0 / 10%);
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;line-height:1.5}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.muted{color:var(--muted-foreground)}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--border)}
.topbar h1{font-size:16px;font-weight:650;margin:0}
.spacer{margin-left:auto}
main{max-width:1240px;margin:0 auto;padding:22px 20px 70px}
.btn{border:1px solid transparent;border-radius:calc(var(--radius) - 2px);padding:8px 14px;font-size:13.5px;
  font-weight:600;cursor:pointer;background:var(--secondary);color:var(--secondary-foreground)}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.destructive{background:var(--destructive);color:oklch(0.985 0 0)}
.btn.outline{background:transparent;border-color:var(--border);color:var(--foreground)}
.btn.ghost{background:transparent;color:var(--foreground)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.icon{padding:7px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.pcard:hover{border-color:var(--ring)}
.pcard h3{margin:0;font-size:15px}.pcard .desc{font-size:13px;color:var(--muted-foreground);min-height:34px}
.pcard .foot{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:11.5px;color:var(--muted-foreground)}
.dots{display:flex;gap:4px}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--primary)}.dot.run{background:var(--ring);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.newcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-style:dashed;
  color:var(--muted-foreground);cursor:pointer;min-height:130px}.newcard:hover{border-color:var(--ring);color:var(--foreground)}
.plus{font-size:26px;line-height:1}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;border:1px solid var(--border)}
.badge.done{background:color-mix(in oklch,var(--primary) 16%,transparent);color:var(--primary);border-color:transparent}
.badge.available{background:var(--secondary);color:var(--secondary-foreground)}
.badge.optional{background:transparent;color:var(--muted-foreground);border-style:dashed}
.badge.locked{background:transparent;color:var(--muted-foreground)}
.badge.running{background:color-mix(in oklch,var(--ring) 22%,transparent);color:var(--foreground)}
.pv{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.sidebar{background:var(--sidebar);color:var(--sidebar-foreground);border:1px solid var(--sidebar-border);border-radius:var(--radius);padding:10px}
.sidebar h4{margin:6px 8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground)}
.stage{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:calc(var(--radius) - 2px);cursor:pointer;border:1px solid transparent}
.stage:hover{background:var(--sidebar-accent)}.stage.sel{background:var(--sidebar-accent);border-color:var(--sidebar-border)}
.stage .num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--muted);color:var(--muted-foreground);flex:none}
.stage.done .num{background:var(--primary);color:var(--primary-foreground)}.stage.running .num{background:var(--ring);color:var(--foreground)}
.stage .lbl{font-size:13.5px;font-weight:600;flex:1}.stage.locked{opacity:.55}
.connector{height:8px;width:1px;background:var(--sidebar-border);margin-left:21px}
.kvs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--muted);border-radius:calc(var(--radius) - 2px);padding:6px 11px;font-size:12px}.chip b{font-family:ui-monospace,Menlo,Consolas,monospace}
.banner{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;margin-bottom:14px;background:color-mix(in oklch,var(--ring) 12%,transparent);font-size:13.5px}
.banner.hidden{display:none}
.spin{width:15px;height:15px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;color:var(--muted-foreground);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
tr:last-child td{border-bottom:none}
.st{border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.st.keep,.st.selected{background:color-mix(in oklch,var(--primary) 18%,transparent);color:var(--primary)}
.st.discard,.st.discarded{background:var(--muted);color:var(--muted-foreground)}
.st.crash{background:color-mix(in oklch,var(--destructive) 18%,transparent);color:var(--destructive)}
.st.pending{background:color-mix(in oklch,var(--ring) 18%,transparent);color:var(--foreground)}
.st.doing{background:color-mix(in oklch,var(--primary) 14%,transparent);color:var(--primary)}
.modal{position:fixed;inset:0;background:oklch(0 0 0 / 45%);display:flex;align-items:center;justify-content:center;z-index:30}
.modal.hidden{display:none}
.dialog{background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:min(680px,94vw);max-height:90vh;overflow:auto}
.dialog h3{margin:0 0 6px}
textarea,input[type=text],input[type=number]{width:100%;background:var(--background);border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);color:var(--foreground);font-size:14px;padding:10px 12px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.pdf{width:100%;height:70vh;border:1px solid var(--border);border-radius:var(--radius);background:var(--muted)}
.hidden{display:none}
.sect{font-size:13px;font-weight:650;margin:16px 0 8px}
.desc{font-size:13px;color:var(--muted-foreground);margin:2px 0 14px}
.pre{white-space:pre-wrap;background:var(--muted);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;max-height:60vh;overflow:auto}
.wb{display:grid;grid-template-columns:230px 1fr;gap:12px}
.files-list{border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:6px;max-height:56vh;overflow:auto}
.fitem{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.fitem:hover{background:var(--accent)}.fitem.on{background:var(--accent);border-color:var(--border)}
.fitem .fn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.fitem .fnote{font-size:11px;color:var(--muted-foreground)}
.viewer{border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);max-height:56vh;overflow:auto;padding:12px;background:var(--background)}
.bubble{max-width:90%;padding:9px 12px;border-radius:12px;font-size:13px;margin-bottom:8px;white-space:pre-wrap}
.bubble.c{background:var(--muted);border-left:3px solid var(--primary)}
.bubble.u{background:color-mix(in oklch,var(--ring) 14%,transparent);margin-left:auto}
.inrow{display:flex;gap:8px;margin-top:8px}.inrow input{flex:1}
.fileitem{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:12px}
.fileitem .fn{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.vis{font-size:10px;font-weight:700;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.vis.visited{background:color-mix(in oklch,var(--primary) 16%,transparent);color:var(--primary)}
.vis.new{background:color-mix(in oklch,var(--ring) 16%,transparent);color:var(--foreground)}
.src{font-size:11px;color:var(--primary);font-weight:600}.srcraw{font-size:11px;color:var(--muted-foreground);font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.srcraw a{color:var(--primary)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:5px 11px;border:1px solid var(--border);border-radius:999px;font-size:12px;cursor:pointer}
.tab.on{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
.align{display:inline-block;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.align.yes{background:color-mix(in oklch,var(--primary) 16%,transparent);color:var(--primary)}
.align.no{background:color-mix(in oklch,var(--destructive) 16%,transparent);color:var(--destructive)}
label.fld{font-size:12px;color:var(--muted-foreground);display:block;margin:10px 0 4px}
</style>
</head>
<body>
<div class="topbar">
  <span style="width:10px;height:10px;border-radius:50%;background:var(--primary);display:inline-block"></span>
  <h1>Autoresearch · Conductor</h1><span class="muted" id="crumb"></span>
  <span class="spacer"></span><button class="btn ghost icon" id="themeBtn" title="theme">◐</button>
</div>
<main>
  <section id="projectsView"><div class="grid" id="projectGrid"></div></section>
  <section id="pipelineView" class="hidden">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <button class="btn outline sm" id="backBtn">← Projects</button>
      <h2 id="pName" style="margin:0;font-size:18px"></h2><span class="muted mono" id="pMeta"></span>
    </div>
    <div class="banner hidden" id="loopBanner"><span class="spin"></span><span>The loop is running — other stages are locked.</span>
      <span class="spacer"></span><button class="btn destructive sm" id="bStop">■ Stop loop</button></div>
    <div class="banner hidden" id="taskBanner"><span class="spin"></span><span data-msg>Working…</span>
      <span class="spacer"></span><span class="muted" id="taskSteps" style="font-size:12px"></span></div>
    <p class="desc" id="pDesc"></p>
    <div class="pv">
      <aside class="sidebar"><h4>Pipeline</h4><div id="stageList"></div></aside>
      <div id="stagePanel"></div>
    </div>
  </section>
</main>

<!-- New project intake wizard -->
<div class="modal hidden" id="newModal"><div class="dialog" id="newDialog"></div></div>
<!-- generic info modal (idea.md, spec, etc.) -->
<div class="modal hidden" id="infoModal"><div class="dialog">
  <h3 id="infoTitle"></h3><div class="pre" id="infoBody"></div>
  <div class="row"><button class="btn outline" onclick="hide('infoModal')">Close</button></div></div></div>

<script>
const STAGE_DESC={
 init:"The spec — the controlled source of truth.",
 generate:"Scaffold from the spec, fill the measure + baseline approach, and validate. Browse the files and request changes.",
 setup:"Make it a git repo with a committed baseline, create the run branch, and gate readiness.",
 ideas:"Optional. Collect goal-aligned ideas from papers (paper-limited) and your uploaded documents; add your own with a grammar + alignment review.",
 loop:"Run the experiment cycle autonomously. Locks every other stage until you stop it.",
 analyze:"Summarize the run and produce the PDF report once at least one experiment is kept.",
};
let current=null, selectedStage=null, sig="", genSel=null;
let stopRequested=false, anEmbeddedUrl=null, prevTask={active:false};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function show(id){document.getElementById(id).classList.remove("hidden");}
function hide(id){document.getElementById(id).classList.add("hidden");}
window.hide=hide;
async function api(p){return (await fetch(p)).json();}
async function txt(p){return (await fetch(p)).text();}
async function post(p,o){return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o||{})});}

const themeBtn=document.getElementById("themeBtn");
function theme(t){document.documentElement.classList.toggle("dark",t==="dark");localStorage.setItem("ar-theme",t);}
themeBtn.onclick=()=>theme(document.documentElement.classList.contains("dark")?"light":"dark");
theme(localStorage.getItem("ar-theme")||"light");

/* ---------------- projects ---------------- */
async function renderProjects(){
  const d=await api("/api/projects"); const g=document.getElementById("projectGrid"); g.innerHTML="";
  (d.projects||[]).forEach(p=>{
    const c=document.createElement("div"); c.className="card pcard";
    const dots=["init","generate","setup","ideas","loop","analyze"].map(k=>{
      const on=p.stage_keys.includes(k),run=p.loop_running&&k==="loop";
      return `<span class="dot ${run?'run':(on?'on':'')}" title="${k}"></span>`;}).join("");
    const working=(_task&&_task.active&&_task.slug===p.slug)?'<span class="spin" style="width:11px;height:11px"></span>':'';
    c.innerHTML=`<h3>${esc(p.name)}</h3><div class="desc">${esc(p.description||"")}</div>
      <div class="foot"><span class="mono">${esc(p.slug)}</span>${working}<span class="spacer"></span><span class="dots">${dots}</span></div>`;
    c.onclick=()=>openProject(p.slug); g.appendChild(c);
  });
  const nc=document.createElement("div"); nc.className="card newcard";
  nc.innerHTML='<span class="plus">＋</span><span>New project</span>'; nc.onclick=openNew; g.appendChild(nc);
}

/* ---------------- new-project intake wizard ---------------- */
let newPhase="idle", newSelVar=1;
function openNew(){ newPhase="idle"; renderNew(); show("newModal"); pollNew(); }
function renderNew(state){
  const d=document.getElementById("newDialog");
  if(newPhase==="idle"){
    d.innerHTML=`<h3>New research project</h3>
     <p class="desc">Describe the idea in one line. The conductor runs <b>init</b> — it may ask a couple of questions, then shows the spec for review before creating the project.</p>
     <label class="fld">Research idea</label><textarea id="nIdea" placeholder="e.g. tune a constructive heuristic to find shorter travelling-salesman tours"></textarea>
     <label class="fld">Project name (optional)</label><input type="text" id="nName" placeholder="auto-derived if blank"/>
     <label class="fld">Domain hint (optional)</label><input type="text" id="nDomain" placeholder="e.g. ML training / algorithm / optimization"/>
     <div class="row"><button class="btn outline" onclick="hide('newModal')">Cancel</button>
       <button class="btn primary" id="nStart">Start</button></div>`;
    document.getElementById("nStart").onclick=async()=>{
      const idea=document.getElementById("nIdea").value.trim(); if(!idea)return;
      await post("/api/new/start",{idea,name:document.getElementById("nName").value.trim(),domain:document.getElementById("nDomain").value.trim()});
      newPhase="thinking"; renderNew();
    };
  } else if(newPhase==="thinking"){
    d.innerHTML=`<h3>Working…</h3><p class="desc"><span class="spin"></span> ${esc((state&&state.message)||"Thinking…")}</p>`;
  } else if(newPhase==="questions"){
    const q=state.questions||{};
    const items=(q.questions||[]).map(x=>`<label class="fld">${esc(x.text)}${x.hint?` <span class="muted">(${esc(x.hint)})</span>`:""}</label><input type="text" data-qid="${esc(x.id)}" />`).join("");
    d.innerHTML=`<h3>A few questions</h3><p class="desc">${esc(q.intro||"Help me pin down the setup:")}</p>${items}
      <div class="row"><button class="btn outline" onclick="hide('newModal')">Cancel</button><button class="btn primary" id="nAns">Submit answers</button></div>`;
    document.getElementById("nAns").onclick=async()=>{
      const ans={}; d.querySelectorAll("input[data-qid]").forEach(i=>ans[i.dataset.qid]=i.value.trim());
      await post("/api/new/answers",{answers:ans}); newPhase="thinking"; renderNew();
    };
  } else if(newPhase==="review"){
    const v=state.variations||{variations:[]};
    const tabs=(v.variations||[]).map(x=>`<span class="tab ${x.id===newSelVar?'on':''}" onclick="pickVar(${x.id})">${esc(x.label||('v'+x.id))}</span>`).join("");
    d.innerHTML=`<h3>Review the spec</h3><p class="desc">Read the inferred setup (assumptions are inside the spec). Request a change to create a new variation, or confirm to create the project.</p>
      <div class="tabs">${tabs}</div><div class="pre" id="specBox">loading…</div>
      <label class="fld">Request a change (optional)</label>
      <div class="inrow"><input type="text" id="nChange" placeholder="e.g. cap runs at 3 min, use PSNR, switch dataset…"/><button class="btn outline" id="nChangeBtn">Revise</button></div>
      <div class="row"><button class="btn outline" onclick="hide('newModal')">Cancel</button><button class="btn primary" id="nConfirm">Confirm &amp; create</button></div>`;
    loadVarSpec();
    document.getElementById("nChangeBtn").onclick=async()=>{
      const t=document.getElementById("nChange").value.trim(); if(!t)return;
      await post("/api/new/change",{text:t,base_id:newSelVar}); newPhase="thinking"; renderNew();
    };
    document.getElementById("nConfirm").onclick=async()=>{ await post("/api/new/confirm",{id:newSelVar}); newPhase="thinking"; renderNew(); };
  } else if(newPhase==="confirmed"){
    d.innerHTML=`<h3>Created ✓</h3><p class="desc">${esc((state&&state.message)||"Project created.")}</p>
      <div class="row"><button class="btn primary" onclick="afterCreate()">Open project</button></div>`;
  }
}
window.pickVar=(id)=>{newSelVar=id; loadVarSpec(); document.querySelectorAll('#newDialog .tab').forEach(t=>t.classList.remove('on'));};
async function loadVarSpec(){ const box=document.getElementById("specBox"); if(box) box.textContent=await txt("/api/new/spec?id="+newSelVar); }
let createdSlug=null;
window.afterCreate=()=>{ hide("newModal"); renderProjects(); if(createdSlug) openProject(createdSlug); };
async function pollNew(){
  if(document.getElementById("newModal").classList.contains("hidden")) return;
  const s=await api("/api/new/state");
  if(s.phase==="questions" && newPhase!=="questions"){ s.questions=await api("/api/new/questions"); newPhase="questions"; renderNew(s); }
  else if(s.phase==="review" && newPhase!=="review"){ s.variations=await api("/api/new/variations"); newPhase="review"; renderNew(s); }
  else if(s.phase==="review" && newPhase==="review"){ /* refresh variations on change */ }
  else if(s.phase==="confirmed"){ createdSlug=s.slug; if(newPhase!=="confirmed"){newPhase="confirmed"; renderNew(s);} }
  else if(s.phase==="thinking" && newPhase==="thinking"){ renderNew(s); }
  setTimeout(pollNew,1200);
}

/* ---------------- pipeline ---------------- */
async function openProject(slug){ current=slug; selectedStage=null; sig=""; hide("projectsView"); show("pipelineView");
  document.getElementById("crumb").textContent="/ "+slug; await renderDetail(true); }
document.getElementById("backBtn").onclick=()=>{ current=null; hide("pipelineView"); show("projectsView");
  document.getElementById("crumb").textContent=""; renderProjects(); };
document.getElementById("bStop").onclick=requestStop;
function requestStop(e){
  if(stopRequested) return;
  stopRequested=true;
  document.querySelectorAll("#bStop,#lpStop").forEach(b=>{if(b){b.disabled=true;b.textContent="■ Stopping…";}});
  post("/api/run/loop/stop?slug="+enc(current));
}
window.requestStop=requestStop;
function enc(s){return encodeURIComponent(s);}

async function renderDetail(force){
  if(!current) return;
  const d=await api("/api/project?slug="+enc(current)); if(d.error) return;
  const s=JSON.stringify(d); if(s===sig&&!force) return; sig=s;
  document.getElementById("pName").textContent=d.name;
  document.getElementById("pMeta").textContent=(d.metric?d.metric+" ("+(d.direction||"").replace(/_/g," ")+")":"")+(d.run_tag?"  ·  "+d.run_tag:"");
  document.getElementById("pDesc").textContent=d.description||"";
  if(!d.loop_running) stopRequested=false;   // loop actually stopped → reset
  document.getElementById("loopBanner").classList.toggle("hidden",!d.loop_running);
  const bStop=document.getElementById("bStop");
  if(bStop){ bStop.disabled=stopRequested; bStop.textContent=stopRequested?"■ Stopping…":"■ Stop loop"; }
  if(!selectedStage) selectedStage=(d.stages.find(x=>x.status==="available"||x.status==="running")||d.stages[0]).key;
  const list=document.getElementById("stageList"); list.innerHTML="";
  d.stages.forEach((st,i)=>{
    const r=document.createElement("div"); r.className="stage "+st.status+(st.key===selectedStage?" sel":"");
    const work=(_task&&_task.active&&_task.slug===current&&_task.stage===st.key)?'<span class="spin" style="width:13px;height:13px;margin-right:4px"></span>':'';
    r.innerHTML=`<span class="num">${st.done?"✓":(i+1)}</span><span class="lbl">${st.label}${st.optional?' <span class="muted" style="font-weight:400">· optional</span>':''}</span>${work}<span class="badge ${st.status}">${st.status}</span>`;
    r.onclick=()=>{selectedStage=st.key; renderPanel(d);};
    list.appendChild(r);
    if(i<d.stages.length-1){const c=document.createElement("div");c.className="connector";list.appendChild(c);}
  });
  renderPanel(d);
}

function stageObj(d){return d.stages.find(x=>x.key===selectedStage);}
function renderPanel(d){
  const k=selectedStage;
  if(k==="init") return panelInit(d);
  if(k==="generate") return panelGenerate(d);
  if(k==="setup") return panelSetup(d);
  if(k==="ideas") return panelIdeas(d);
  if(k==="loop") return panelLoop(d);
  if(k==="analyze") return panelAnalyze(d);
}
function head(d,extra){const s=stageObj(d);return `<div style="display:flex;align-items:center;gap:10px"><h3 style="margin:0;font-size:16px">${s.label}</h3><span class="badge ${s.status}">${s.status}</span>${extra||""}</div><p class="desc">${esc(STAGE_DESC[s.key])}</p>`;}
function P(){return document.getElementById("stagePanel");}

/* init */
async function panelInit(d){
  P().innerHTML=`<div class="card">${head(d)}<button class="btn outline sm" id="viewSpec">view spec.md</button></div>`;
  document.getElementById("viewSpec").onclick=async()=>{document.getElementById("infoTitle").textContent="spec.md";
    document.getElementById("infoBody").textContent=await txt("/api/spec?slug="+enc(current)); show("infoModal");};
}
/* generate */
async function panelGenerate(d){
  const s=stageObj(d);
  P().innerHTML=`<div class="card">${head(d)}
    ${s.enabled?`<button class="btn primary exec" id="genExec">${s.done?'↻ Rebuild':'▶ Execute — build'}</button>`:`<button class="btn" disabled>complete setup-prereqs first</button>`}
    <div id="genVal" style="margin-top:12px"></div>
    <div class="wb" style="margin-top:12px"><div class="files-list" id="genFiles"></div><div class="viewer pre" id="genView">select a file</div></div>
    <div class="sect">Request a change</div><div id="genChat"></div>
    <div class="inrow"><input type="text" id="genMsg" placeholder="e.g. use a 2-layer encoder, cap at 3 min"/><button class="btn outline" id="genSend">Send</button></div>
    </div>`;
  if(s.enabled) document.getElementById("genExec").onclick=async()=>{const r=await post("/api/gen/execute?slug="+enc(current));if(!r.ok)alert((await r.json()).error);};
  document.getElementById("genSend").onclick=async()=>{const t=document.getElementById("genMsg").value.trim();if(!t)return;await post("/api/gen/chat?slug="+enc(current),{text:t});document.getElementById("genMsg").value="";};
  refreshGen();
}
async function refreshGen(){
  if(selectedStage!=="generate") return;
  const m=await api("/api/gen/manifest?slug="+enc(current));
  const val=document.getElementById("genVal"); if(!val) return;
  if(m.validation&&m.validation.ok!==undefined)
    val.innerHTML=`<span class="badge ${m.validation.ok?'done':'locked'}">${m.validation.ok?'✓ '+esc(m.validation.summary||'valid'):'✗ '+esc(m.validation.summary||'invalid')}</span>`;
  const fl=document.getElementById("genFiles"); fl.innerHTML="";
  (m.files||[]).forEach(f=>{const e=document.createElement("div");e.className="fitem"+(f.path===genSel?" on":"");
    e.innerHTML=`<div class="fn">${esc(f.label||f.path)}</div>${f.note?`<div class="fnote">${esc(f.note)}</div>`:""}`;
    e.onclick=async()=>{genSel=f.path;document.getElementById("genView").textContent=await txt("/api/gen/file?slug="+enc(current)+"&path="+enc(f.path));refreshGen();};fl.appendChild(e);});
  const ch=document.getElementById("genChat"); ch.innerHTML=(m.chat||[]).map(c=>`<div class="bubble ${c.role==='user'?'u':'c'}">${esc(c.text)}</div>`).join("");
}
/* setup */
async function panelSetup(d){
  const s=stageObj(d);
  P().innerHTML=`<div class="card">${head(d)}
    ${s.enabled?`<button class="btn primary exec" id="setExec">${s.done?'↻ Re-run setup':'▶ Execute — prepare run'}</button>`:`<button class="btn" disabled>${d.loop_running?'locked while loop runs':'complete generate first'}</button>`}
    <div id="setRes" style="margin-top:12px"></div></div>`;
  if(s.enabled) document.getElementById("setExec").onclick=async()=>{const r=await post("/api/setup/execute?slug="+enc(current));if(!r.ok)alert((await r.json()).error);};
  refreshSetup();
}
async function refreshSetup(){ if(selectedStage!=="setup")return; const r=await api("/api/setup/result?slug="+enc(current));
  const box=document.getElementById("setRes"); if(!box)return;
  if(r.lines) box.innerHTML=r.lines.map(l=>`<div style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px">${esc(l)}</div>`).join("");
  else box.innerHTML='<span class="muted" style="font-size:12.5px">Run setup to prepare the git baseline + run branch and gate readiness.</span>';
}
/* ideas */
let ideaPaperLimit=10;
async function panelIdeas(d){
  const s=stageObj(d);
  P().innerHTML=`<div class="card">${head(d)}
    <div class="wb"><div>
      <div class="sect" style="margin-top:0">Files</div><div id="idFiles"></div>
      <input type="file" id="idUp" multiple accept=".pdf,.txt,.html,.htm,.md" style="display:none"/>
      <button class="btn outline sm" id="idUpBtn" style="width:100%">⭱ Upload files</button>
    </div><div>
      <div class="inrow"><div><label class="fld" style="margin-top:0">Paper limit</label><input type="number" id="idLim" min="1" max="100" value="${ideaPaperLimit}" style="width:90px"/></div>
        <div style="display:flex;align-items:flex-end;gap:8px">${s.enabled?`<button class="btn primary exec" id="idExec">▶ Execute — find ideas</button>`:`<button class="btn" disabled>complete setup first</button>`}
        <button class="btn outline" id="idNew">＋ New idea</button><button class="btn outline" id="idView">idea.md</button></div></div>
      <div class="kvs" id="idChips" style="margin-top:12px"></div>
      <table><thead><tr><th>#</th><th>status</th><th>idea</th><th>source</th></tr></thead><tbody id="idRows"></tbody></table>
    </div></div></div>`;
  document.getElementById("idUpBtn").onclick=()=>document.getElementById("idUp").click();
  document.getElementById("idUp").onchange=async(e)=>{for(const f of [...e.target.files]){const buf=await f.arrayBuffer();
    await fetch("/api/ideas/upload?slug="+enc(current)+"&name="+enc(f.name),{method:"POST",body:buf});}e.target.value="";refreshIdeas();};
  if(s.enabled) document.getElementById("idExec").onclick=async()=>{ideaPaperLimit=parseInt(document.getElementById("idLim").value)||10;
    const r=await post("/api/ideas/execute?slug="+enc(current),{paper_limit:ideaPaperLimit});if(!r.ok)alert((await r.json()).error);};
  document.getElementById("idNew").onclick=openPropose;
  document.getElementById("idView").onclick=async()=>{document.getElementById("infoTitle").textContent="idea.md";
    document.getElementById("infoBody").textContent=await txt("/api/ideas/idea_md?slug="+enc(current));show("infoModal");};
  refreshIdeas();
}
async function refreshIdeas(){
  if(selectedStage!=="ideas")return;
  const d=await api("/api/ideas/list?slug="+enc(current)); const c=d.counts||{};
  const ch=document.getElementById("idChips"); if(ch) ch.innerHTML=
    `<div class="chip">total <b>${c.total||0}</b></div><div class="chip">pending <b>${c.pending||0}</b></div><div class="chip">doing <b>${c.doing||0}</b></div><div class="chip">selected <b>${c.selected||0}</b></div><div class="chip">discarded <b>${c.discarded||0}</b></div>`;
  const tb=document.getElementById("idRows"); if(tb) tb.innerHTML=(d.ideas||[]).map(i=>{
    const raw=i.source||"",link=(raw.match(/https?:\/\/\S+/)||[])[0];
    const det=link?`<a href="${esc(link)}" target="_blank">${esc(link)}</a>`:(/^doc:/i.test(raw)?esc(raw.replace(/^doc:\s*/i,"📄 ")):esc(raw));
    return `<tr><td>${i.idx}</td><td><span class="st ${esc(i.status)}">${esc(i.status)}</span></td><td>${esc(i.text)}</td><td><span class="src">${esc(i.source_cat||"")}</span><br><span class="srcraw">${det}</span></td></tr>`;}).join("");
  const fl=document.getElementById("idFiles"); if(fl) fl.innerHTML=(d.files||[]).map(f=>`<div class="fileitem"><span class="fn">${esc(f.name)}</span><span class="vis ${f.status==='visited'?'visited':'new'}">${f.status}</span></div>`).join("")||'<span class="muted" style="font-size:12px">No files yet.</span>';
}
function openPropose(){
  const d=document.getElementById("newDialog");
  document.getElementById("newDialog").innerHTML=`<h3>Add your own idea</h3>
    <p class="desc">Write it in any words — the agent fixes the grammar (≤3–4 sentences), checks alignment with the goal, and shows an opinion before adding.</p>
    <textarea id="propText" placeholder="e.g. maybe add skip connection make sharper image"></textarea>
    <div class="row"><button class="btn outline" onclick="hide('newModal')">Cancel</button><button class="btn primary" id="propSend">Review against goal</button></div>`;
  show("newModal");
  document.getElementById("propSend").onclick=async()=>{const t=document.getElementById("propText").value.trim();if(!t)return;
    await post("/api/ideas/propose?slug="+enc(current),{text:t});
    document.getElementById("newDialog").innerHTML=`<h3>Reviewing…</h3><p class="desc"><span class="spin"></span> Checking your idea against the goal…</p>`;
    pollProposal();};
}
async function pollProposal(){
  if(document.getElementById("newModal").classList.contains("hidden"))return;
  const p=await api("/api/ideas/proposal?slug="+enc(current));
  if(p&&p.pending){
    document.getElementById("newDialog").innerHTML=`<h3>Review before adding</h3>
      <div class="align ${p.aligned?'yes':'no'}">${p.aligned?'✓ aligns with the goal':'✗ does not clearly align'}</div>
      <div class="pre">${esc(p.cleaned||"")}</div>
      <div style="border-left:3px solid var(--primary);padding:10px 13px;border-radius:6px;background:var(--muted);margin:10px 0;font-size:13px"><b>Agent's opinion:</b> ${esc(p.opinion||"")}</div>
      <div class="row"><button class="btn outline" id="pCancel">Cancel</button><button class="btn ${p.aligned?'outline':'destructive'}" id="pForce">Add anyway</button>${p.aligned?`<button class="btn primary" id="pAdd">Add to basket</button>`:""}</div>`;
    document.getElementById("pCancel").onclick=async()=>{await post("/api/ideas/confirm?slug="+enc(current),{accept:false});hide("newModal");};
    document.getElementById("pForce").onclick=async()=>{await post("/api/ideas/confirm?slug="+enc(current),{accept:true,force:true});hide("newModal");};
    const add=document.getElementById("pAdd"); if(add) add.onclick=async()=>{await post("/api/ideas/confirm?slug="+enc(current),{accept:true,force:false});hide("newModal");};
    return;
  }
  setTimeout(pollProposal,1200);
}
/* loop */
async function panelLoop(d){
  const s=stageObj(d);
  let ctl;
  if(d.loop_running) ctl=`<button class="btn destructive" id="lpStop" ${stopRequested?"disabled":""}>${stopRequested?"■ Stopping…":"■ Stop loop"}</button>`;
  else if(s.enabled) ctl=`<button class="btn primary exec" id="lpStart">▶ Start loop</button>`;
  else ctl=`<button class="btn" disabled>complete setup first</button>`;
  P().innerHTML=`<div class="card">${head(d)}${ctl}
    <div class="kvs" id="lpChips" style="margin-top:12px"></div>
    <div style="overflow:auto;max-height:42vh"><table><thead id="lpHead"></thead><tbody id="lpBody"></tbody></table></div>
    <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:13px">Latest run log</summary><div class="pre" id="lpLog" style="margin-top:8px">(no log yet)</div></details></div>`;
  if(d.loop_running){const b=document.getElementById("lpStop"); if(b) b.onclick=requestStop;}
  else if(s.enabled) document.getElementById("lpStart").onclick=async()=>{const r=await post("/api/run/loop/start?slug="+enc(current));if(!r.ok)alert((await r.json()).error);};
  refreshLoop(d);
}
async function refreshLoop(d){
  if(selectedStage!=="loop")return;
  const su=d&&d.summary?d.summary:(await api("/api/project?slug="+enc(current))).summary||{};
  const ch=document.getElementById("lpChips"); if(ch&&su.total!==undefined) ch.innerHTML=
    `<div class="chip">experiments <b>${su.total||0}</b></div><div class="chip">kept <b>${su.keep||0}</b></div><div class="chip">discard <b>${su.discard||0}</b></div><div class="chip">crash <b>${su.crash||0}</b></div>`+(su.baseline!=null?`<div class="chip">baseline <b>${(+su.baseline).toFixed(4)}</b></div>`:"")+(su.best!=null?`<div class="chip">best <b>${(+su.best).toFixed(4)}</b></div>`:"");
  const r=await api("/api/results?slug="+enc(current)); const head=r.header||[],rows=r.rows||[],si=head.indexOf("status");
  const th=document.getElementById("lpHead"); if(th) th.innerHTML="<tr>"+head.map(h=>`<th>${esc(h)}</th>`).join("")+"</tr>";
  const tb=document.getElementById("lpBody"); if(tb) tb.innerHTML=rows.map(row=>"<tr>"+row.map((c,i)=>i===si?`<td><span class="st ${(c||'').toLowerCase()}">${esc(c)}</span></td>`:`<td>${esc(c)}</td>`).join("")+"</tr>").join("");
  const lg=document.getElementById("lpLog"); if(lg){const t=await txt("/api/run/log?slug="+enc(current)); if(t&&t.trim()) lg.textContent=t;}
}
/* analyze */
async function panelAnalyze(d){
  const s=stageObj(d);
  anEmbeddedUrl=null;   // re-embed once when (re)opening the panel
  P().innerHTML=`<div class="card">${head(d)}
    ${s.enabled?`<button class="btn primary exec" id="anExec">${d.has_report?'↻ Regenerate report':'▶ Execute — generate report'}</button>`:`<button class="btn" disabled>need at least one kept run</button>`}
    <div class="kvs" id="anChips" style="margin-top:12px"></div>
    <div id="anReport" style="margin-top:12px"></div></div>`;
  if(s.enabled) document.getElementById("anExec").onclick=async()=>{const r=await post("/api/analyze/execute?slug="+enc(current));if(!r.ok)alert((await r.json()).error);};
  refreshAnalyze(d);
}
async function refreshAnalyze(d){
  if(selectedStage!=="analyze")return;
  const su=await api("/api/analyze/summary?slug="+enc(current));
  const ch=document.getElementById("anChips");
  if(ch&&su&&su.total!==undefined) ch.innerHTML=`<div class="chip">experiments <b>${su.total}</b></div><div class="chip">kept <b>${su.keep}</b></div>`+(su.baseline!=null?`<div class="chip">baseline <b>${(+su.baseline).toFixed(4)}</b></div>`:"")+(su.best!=null?`<div class="chip">best <b>${(+su.best).toFixed(4)}</b></div>`:"")+(su.pct_improvement!=null?`<div class="chip">improvement <b>${su.pct_improvement>=0?'+':''}${(+su.pct_improvement).toFixed(1)}%</b></div>`:"");
  const ra=document.getElementById("anReport"); if(!ra) return;
  if(d&&d.has_report){
    const url="/api/report?slug="+enc(current);
    if(anEmbeddedUrl!==url){          // embed ONCE — avoids the per-poll PDF reload/flicker
      ra.innerHTML=`<object class="pdf" data="${url}#${Date.now()}" type="application/pdf"></object>`+
        `<div style="margin-top:8px"><a class="btn outline sm" href="${url}" download="report.pdf">⭳ Download PDF</a></div>`;
      anEmbeddedUrl=url;
    }
  } else if(anEmbeddedUrl!==null || ra.innerHTML===""){ ra.innerHTML='<span class="muted" style="font-size:12.5px">No report yet.</span>'; anEmbeddedUrl=null; }
}

/* task / loading progress */
let _task={active:false};
function renderTaskUI(){
  const t=_task||{active:false};
  const banner=document.getElementById("taskBanner");
  if(banner){
    if(t.active){
      banner.classList.remove("hidden");
      const where=(t.slug&&t.slug!=="(new)")?(" on "+t.slug):"";
      banner.querySelector("[data-msg]").textContent=`Claude is working — ${t.stage||""}${where}: ${t.message||"…"}`;
      const steps=(t.steps||[]);
      const done=steps.filter(s=>s.done).length;
      document.getElementById("taskSteps").textContent=steps.length?`step ${Math.min(done+1,steps.length)}/${steps.length}`:"";
    } else banner.classList.add("hidden");
  }
  // one task at a time → disable every stage Execute while busy (Stop stays live)
  document.querySelectorAll(".exec").forEach(b=>{ b.disabled=!!t.active; });
}

async function poll(){
  try{
    try{ _task=await api("/api/task"); }catch(e){ _task={active:false}; }
    // a finished analyze run → reload the embedded PDF exactly once
    if(prevTask.active && !_task.active && prevTask.slug===current && prevTask.stage==="analyze") anEmbeddedUrl=null;
    prevTask=_task;
    if(!current){ await renderProjects(); }
    else{
      await renderDetail(false);
      if(selectedStage==="generate") refreshGen();
      else if(selectedStage==="setup") refreshSetup();
      else if(selectedStage==="ideas") refreshIdeas();
      else if(selectedStage==="loop") refreshLoop(null);
      else if(selectedStage==="analyze") refreshAnalyze(await api("/api/project?slug="+enc(current)));
    }
    renderTaskUI();
  }catch(e){}
}
setInterval(poll,1500); renderProjects();
</script>
